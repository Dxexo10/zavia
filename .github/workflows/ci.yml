name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: "1. Preparación"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.0.0
          cache: pnpm
      - name: Instalar y verificar Gitleaks CLI 8.30.1
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          asset="gitleaks_8.30.1_linux_x64.tar.gz"
          checksum_file="gitleaks_8.30.1_checksums.txt"
          cd "$workdir"
          curl --fail --location --silent --show-error --output "$asset" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          curl --fail --location --silent --show-error --output "$checksum_file" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$checksum_file"
          grep -E "^[[:xdigit:]]{64}  $asset$" "$checksum_file" | sha256sum --check --strict -
          tar --extract --gzip --file "$asset" gitleaks
          "$workdir/gitleaks" git "$GITHUB_WORKSPACE" --redact=100
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=high
      - name: Verificar acciones fijadas por SHA
        run: >
          node -e "const fs=require('node:fs'); const source=fs.readFileSync('.github/workflows/ci.yml','utf8'); const refs=[...source.matchAll(/uses:\\s+[^@\\s]+@([^\\s#]+)/g)].map(([,ref])=>ref); if(refs.some((ref)=>!/^[a-f0-9]{40}$/.test(ref))) process.exit(1);"

  static:
    name: "2. Estática"
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:layers
      - run: pnpm check:traceability

  fast:
    name: "3. Rápidas"
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:coverage

  data:
    name: "4. Datos"
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:start
      - run: pnpm test:integration

  build:
    name: "5. Build"
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.0.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Verificar que pseudo no se incluye en producción
        run: "! rg -n 'pseudo' .next"

  future-quality:
    name: "Marcadores de calidad futura"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "E2E pendiente (se activa en F4/F13)"
      - run: echo "Accesibilidad pendiente (se activa en F4/F13)"
      - run: echo "Visual pendiente (se activa en F4/F13)"
      - run: echo "Lighthouse pendiente (se activa en F4/F13)"
